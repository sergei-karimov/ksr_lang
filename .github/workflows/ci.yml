name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KSR.sln

      - name: Build
        run: dotnet build KSR.sln -c Release --no-restore

      # tests/KSR.Cli.Tests expects artifacts/Kestrel.Templates.0.1.0.nupkg (and the
      # packages it depends on) to already exist — mirrors the pack step in
      # scripts/install.sh / scripts/install.ps1.
      - name: Pack public packages
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            KSR.Core.csproj \
            sdk/KSR.Build/KSR.Build.csproj \
            sdk/KSR.Sdk/KSR.Sdk.csproj \
            sdk/KSR.StdLib/KSR.StdLib.csproj \
            sdk/KSR.Creative/KSR.Creative.csproj \
            sdk/KSR.Templates/KSR.Templates.csproj \
            KSR.csproj; do
            dotnet pack "$project" -c Release -o artifacts --no-restore --nologo
          done

      - name: Test KSR.Tests
        run: dotnet test tests/KSR.Tests/KSR.Tests.csproj -c Release --no-build --nologo

      - name: Test KSR.Cli.Tests
        run: dotnet test tests/KSR.Cli.Tests/KSR.Cli.Tests.csproj -c Release --no-build --nologo
